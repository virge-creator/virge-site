<svg xmlns="http://www.w3.org/2000/svg" width="140" height="96" viewBox="0 0 140 96">
  <defs>
    <!-- Brand gradient: cyan top-left → deep blue bottom-right -->
    <linearGradient id="cg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%"   stop-color="#4ecdc4"/>
      <stop offset="35%"  stop-color="#29a8d4"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>

    <!-- Cloud outline used as clip mask for wave ribbons -->
    <clipPath id="cc">
      <path d="
        M 14 78
        Q 6 78 6 66
        Q 6 54 16 52
        Q 12 34 26 32
        Q 26 16 40 14
        Q 50 6 62 14
        Q 70 6 80 16
        Q 94 12 98 28
        Q 114 26 114 42
        Q 116 62 102 68
        L 14 78 Z
      "/>
    </clipPath>
  </defs>

  <!-- Cloud fill -->
  <path d="
    M 14 78
    Q 6 78 6 66
    Q 6 54 16 52
    Q 12 34 26 32
    Q 26 16 40 14
    Q 50 6 62 14
    Q 70 6 80 16
    Q 94 12 98 28
    Q 114 26 114 42
    Q 116 62 102 68
    L 14 78 Z
  " fill="url(#cg)"/>

  <!--
    Wave ribbons: two 5px-thick white S-curve bands that slice through the
    cloud from lower-left to upper-right, creating three colour zones:
      cyan (top-right) · mid-blue (centre) · deep-blue (lower-left)

    At x=60 (cloud centre, height ≈ 8..74 = 66px):
      ribbon 1 is centred at y≈31 (≈ top third)
      ribbon 2 is centred at y≈51 (≈ bottom third)

    At the left edge (x=6, cloud height ≈ 54..78 = 24px):
      ribbon 1 at y≈60, ribbon 2 at y≈68  → 6px top band, 6px mid, 4px bottom

    The cubic bezier control points create the S-inflection that mirrors the
    flowing S-curves visible in the Virge mark.
  -->

  <!-- Ribbon 1 (upper separator) -->
  <path d="
    M  6 57
    C 30 64  46 20  62 26
    C 78 32  92 36 114 40
    L 114 45
    C  92 41  78 37  62 31
    C  46 25  30 69   6 62
    Z
  " fill="white" clip-path="url(#cc)"/>

  <!-- Ribbon 2 (lower separator) -->
  <path d="
    M  6 67
    C 30 74  46 44  62 48
    C 78 52  94 54 114 56
    L 114 61
    C  94 59  78 57  62 53
    C  46 49  30 79   6 72
    Z
  " fill="white" clip-path="url(#cc)"/>
</svg>
